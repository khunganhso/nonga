function HomePage({ onNavigate }) {
  // Hàm này quét xem Menu đó có những tag nào thực tế từ cục dữ liệu
  const getTagsForMenu = (menuId) => {
    const lessonsInMenu = lessons.filter(l => l.menuId === menuId);
    return [...new Set(lessonsInMenu.map(l => l.tag).filter(Boolean))];
  };

  const CategoryCard = ({ title, titleColor, menuId, tagBg, tagText }) => {
    const tags = getTagsForMenu(menuId);
    if (tags.length === 0) return null; // Ẩn nếu Menu chưa có bài viết

    return (
      <div className="bg-white/95 backdrop-blur-md rounded-[28px] p-5 shadow-xl flex flex-col items-center border border-white/50">
        <h2 className={`text-[22px] md:text-[24px] font-black uppercase mb-4 text-center tracking-tight ${titleColor}`}>
          {title}
        </h2>
        <div className="w-full space-y-2.5 flex-1 flex flex-col justify-start">
          {tags.map(tag => (
            <button
              key={tag}
              onClick={() => onNavigate(menuId, tag)} // Deeplink vào thẳng Tag
              className={`w-full py-2.5 px-3 rounded-full font-bold uppercase text-[12px] md:text-[13px] tracking-wide transition-all active:scale-95 hover:shadow-md shadow-sm border border-transparent hover:border-black/5 ${tagBg} ${tagText}`}
            >
              {tag}
            </button>
          ))}
        </div>
      </div>
    );
  };

// =========================================================================
// GIAO DIỆN HIỂN THỊ TỪNG BÀI
// =========================================================================
function LessonRow({ lesson }) {
  const containerRef = useRef(null);
  const [isFullscreen, setIsFullscreen] = useState(false);

  useEffect(() => {
    const onFullscreenChange = () => { setIsFullscreen(!!document.fullscreenElement); };
    document.addEventListener('fullscreenchange', onFullscreenChange);
    return () => document.removeEventListener('fullscreenchange', onFullscreenChange);
  }, []);

  const handleFullScreen = () => {
    if (!document.fullscreenElement && containerRef.current) {
      containerRef.current.requestFullscreen().catch(err => console.log(err));
    }
  };

  const ratioStyle = lesson.canvaUrl ? { aspectRatio: lesson.canvaRatio || '1200 / 3600' } : { minHeight: '300px' };

  return (
    <div className="flex flex-col bg-white/90 backdrop-blur-md rounded-[20px] border border-gray-100 shadow-xl mb-10 overflow-hidden">
      <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
         <h2 className="text-[17px] sm:text-[19px] font-bold text-gray-800 tracking-tight">{lesson.title}</h2>
         {!isFullscreen && lesson.canvaUrl && (
            <button onClick={handleFullScreen} className="text-gray-500 hover:text-google-blue transition-colors flex items-center gap-1.5 text-sm font-medium bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
               <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
               <span className="hidden sm:inline">Phóng to</span>
            </button>
         )}
      </div>
      
      <div ref={containerRef} className="w-full bg-[#f4f6f8] relative" style={ratioStyle}>
        {lesson.canvaUrl ? (
           <iframe className="absolute inset-0 w-full h-full bg-white block" src={lesson.canvaUrl} allowFullScreen allow="fullscreen" style={{border: 'none'}} title={`Canva - ${lesson.title}`}></iframe>
        ) : (
           <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-400 p-10 text-center bg-gray-50">
             <p className="text-[14px] font-medium">Chưa có nội dung đính kèm</p>
           </div>
        )}
      </div>
    </div>
  );
}

// =========================================================================
// BẢNG ĐIỀU KHIỂN CHÍNH
// =========================================================================
function Dashboard() {
  const [activeMenuId, setActiveMenuId] = useState("trang-chu");
  const [activeTag, setActiveTag] = useState("ALL"); 

  const handleMenuChange = (menuId, tag = "ALL") => {
    setActiveMenuId(menuId);
    setActiveTag(tag);
  };

  return (
  <div className="flex flex-col h-screen w-full overflow-hidden bg-transparent">
    
    {/* THANH MENU ĐIỀU HƯỚNG */}
    <div className="bg-white/95 backdrop-blur-md px-3 sm:px-6 py-2 flex items-center overflow-x-auto border-b border-gray-200 flex-shrink-0 gap-1.5 scrollbar-hide z-20 shadow-sm">
      {mainMenus.map((item) => (
        <button
          key={item.id}
          onClick={() => handleMenuChange(item.id)}
          className={`flex flex-shrink-0 items-center gap-2 rounded-full px-4 py-2.5 text-[14px] font-bold uppercase tracking-wide transition-all duration-200 
          ${activeMenuId === item.id ? "bg-google-blue text-white shadow-md" : "text-gray-600 hover:bg-gray-100 hover:text-gray-900"}`}
        >
          <div className={`${activeMenuId === item.id ? "text-white" : "text-gray-400"}`}><item.icon /></div>
          <span className="whitespace-nowrap">{item.name}</span>
        </button>
      ))}
    </div>

    {/* NẾU LÀ TRANG CHỦ -> GỌI COMPONENT HOMEPAGE */}
    {activeMenuId === "trang-chu" ? (
       <HomePage onNavigate={handleMenuChange} />
    ) : (
      /* NẾU CHỌN MENU BÀI VIẾT -> HIỂN THỊ TAG VÀ BÀI VIẾT */
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* TAG CON DƯỚI MENU */}
        <div className="bg-white/90 backdrop-blur-md px-4 sm:px-6 py-3 flex items-center overflow-x-auto border-b border-gray-100 flex-shrink-0 gap-2 scrollbar-hide z-10 shadow-sm">
          <button
            onClick={() => setActiveTag("ALL")}
            className={`flex-shrink-0 px-5 py-2 rounded-full text-[13px] font-bold transition-all duration-200 border 
              ${activeTag === "ALL" ? "bg-google-blue text-white border-google-blue shadow-md" : "bg-white text-gray-600 border-gray-300 hover:border-gray-400 hover:text-gray-900 hover:bg-gray-50"}`}
          >
            Tất Cả Mục
          </button>
          
          {[...new Set(lessons.filter(l => l.menuId === activeMenuId).map(l => l.tag).filter(Boolean))].map(tag => (
            <button
              key={tag}
              onClick={() => setActiveTag(tag)}
              className={`flex-shrink-0 px-5 py-2 rounded-full text-[13px] font-bold uppercase transition-all duration-200 border 
                ${activeTag === tag ? "bg-google-blue text-white border-google-blue shadow-md" : "bg-white text-gray-600 border-gray-300 hover:border-gray-400 hover:text-gray-900 hover:bg-gray-50"}`}
            >
              {tag}
            </button>
          ))}
        </div>

        {/* NỘI DUNG BÀI VIẾT TỪ CANVA */}
        <div className="flex-1 overflow-y-auto p-4 sm:p-8">
          <div className="mx-auto max-w-[1200px]">
            {(() => {
               const filteredLessons = lessons.filter(l => l.menuId === activeMenuId && (activeTag === "ALL" || l.tag === activeTag));
               if (filteredLessons.length > 0) {
                 return (
                   <div className="flex flex-col">
                     {filteredLessons.map(lesson => <LessonRow key={lesson.id} lesson={lesson} />)}
                   </div>
                 );
               } else {
                 return (
                   <div className="mt-8 flex flex-col items-center justify-center rounded-2xl border border-dashed border-gray-300 bg-white/80 backdrop-blur-sm p-16 text-center shadow-sm">
                     <div className="h-16 w-16 mb-4 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                     </div>
                     <h3 className="text-[18px] font-bold text-gray-800 mb-1">Chưa có bài học nào</h3>
                     <p className="text-gray-500 text-sm font-medium">Nội dung chuyên môn đang được cập nhật.</p>
                   </div>
                 );
               }
            })()}
          </div>
        </div>
      </div>
    )}
  </div>
  );
}

// =========================================================================
// MÀN HÌNH ĐĂNG NHẬP
// =========================================================================
function App() {
  const CORRECT_PASSWORD = "nonganewgen2026";
  const [password, setPassword] = useState("");
  const [isAuthorized, setIsAuthorized] = useState(true); 
  const [error, setError] = useState("");
  const [isLoading, setIsLoading] = useState(false);

  useEffect(() => {
    try {
      const authStatus = sessionStorage.getItem("web_authorized");
      if (authStatus === "true") setIsAuthorized(true);
    } catch (err) {}
    setIsLoading(false);
  }, []);

  const handleLogin = (e) => {
    e.preventDefault();
    if (password === CORRECT_PASSWORD) {
      try { sessionStorage.setItem("web_authorized", "true"); } catch (err) {}
      setIsAuthorized(true);
      setError("");
    } else {
      setError("Mật khẩu không chính xác. Vui lòng thử lại.");
    }
  };

  if (isLoading) return <div className="min-h-screen bg-google-surface"></div>;
  if (isAuthorized) return <Dashboard />;

  return (
  <div className="flex min-h-screen items-center justify-center bg-garden p-4">
    <div className="w-full max-w-[400px] overflow-hidden rounded-[24px] border border-white/40 bg-white/95 backdrop-blur-xl shadow-2xl p-8 sm:p-10">
      <div className="text-center mb-8">
        <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-google-blue shadow-lg shadow-blue-500/30">
          <svg className="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.315 48.315 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" /></svg>
        </div>
        <h1 className="text-2xl font-black tracking-tight text-gray-800 mb-1 uppercase">Đăng nhập hệ thống</h1>
        <p className="text-sm font-medium text-gray-500">Đào tạo kỹ thuật Nông Á Newgen</p>
      </div>

      <form onSubmit={handleLogin} className="space-y-5">
        <div>
          <input 
            type="password" 
            placeholder="Nhập mã khóa truy cập..." 
            value={password} 
            onChange={(e) => setPassword(e.target.value)} 
            className="w-full rounded-xl border border-gray-200 bg-gray-50/50 px-4 py-3.5 text-[15px] font-medium transition-all focus:border-google-blue focus:bg-white focus:outline-none focus:ring-2 focus:ring-google-lightBlue placeholder-gray-400" 
            required 
          />
        </div>
        {error && (
          <div className="flex items-center gap-2 text-[13px] font-bold text-red-600 bg-red-50 p-3 rounded-xl border border-red-100">
            <svg className="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path></svg>
            {error}
          </div>
        )}
        <button type="submit" className="w-full rounded-xl bg-google-blue py-3.5 text-center text-[15px] font-bold uppercase tracking-wide text-white shadow-md shadow-blue-500/20 transition-all hover:bg-[#0842A0] hover:shadow-lg hover:shadow-blue-500/30 focus:outline-none focus:ring-2 focus:ring-google-lightBlue active:scale-[0.98]">
          Mở khóa hệ thống
        </button>
      </form>
    </div>
  </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
